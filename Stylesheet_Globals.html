<style>
:root {
  --bg:           #f8fafc;
  --text:         #1e293b;
  --font-main:    'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  --border-color: #f1f5f9;
  --header-bg:    #f8fafc;
  --text-muted:   #64748b;
  --sidebar-width: 265px;
}

/* Single definition of the spin animation (removed duplicate in Stylesheet_Main) */
@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #f3f3f3;
  border-top: 5px solid var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.spinner-small {
  width: 30px;
  height: 30px;
  border: 3px solid #f3f3f3;
  border-top: 3px solid var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.loader-hidden {
  opacity: 0;
  visibility: hidden;
  transition: all 0.5s ease-out;
}
</style>
