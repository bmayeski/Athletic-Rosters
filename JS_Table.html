<script>
/**
 * Handles sidebar sport selection.
 */
function handleSportClick(element, season, sport) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');

  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('sport-view').style.display     = 'block';
  document.getElementById('dashboard-view').style.display = 'none';
  document.getElementById('active-sport-title').innerText = sport;

  // Store the current season so renderRosterTables can use the correct column headers
  window.ACTIVE_SEASON = season;

  updatePeriodBanner();

  if (window.ROSTER_CACHE[sport]) {
    renderRosterTables(window.ROSTER_CACHE[sport]);
    return;
  }

  document.getElementById('roster-tables-container').innerHTML = `
    <div class="text-center p-5">
      <div class="spinner-small" style="margin: 0 auto;"></div>
      <p class="mt-3 text-muted">Retrieving ${sport} Roster...</p>
    </div>`;

  google.script.run
    .withSuccessHandler(data => {
      window.ROSTER_CACHE[sport] = data;
      renderRosterTables(data);
    })
    .withFailureHandler(err => {
      document.getElementById('roster-tables-container').innerHTML = `
        <div class="alert alert-danger m-4">
          <i class="fas fa-exclamation-triangle"></i> Error loading ${sport}: ${err.message}
        </div>`;
    })
    .getMergedSportData(window.GLOBAL_SCHOOL, sport);
}

// ─── Render Functions ─────────────────────────────────────────────────────────

function renderRosterTables(payload) {
  const container = document.getElementById('roster-tables-container');
  if (!container) return;
  container.innerHTML = '';

  let masterHeaders = [];
  let rosterData = [];

  // Safely unpack the new `{ masterHeaders, roster }` payload
  if (payload && Array.isArray(payload.roster)) {
    rosterData = payload.roster;
    masterHeaders = payload.masterHeaders;
  } else if (Array.isArray(payload)) {
    rosterData = payload; 
  }

  const levels = ['Varsity', 'Junior Varsity', 'Freshman', 'Dropped'];

  levels.forEach(level => {
    const idxLast = masterHeaders.indexOf('Last Name');
    
    const filteredRows = rosterData
      .filter(row => row.level === level)
      .sort((a, b) => {
         const nameA = String(a.masterData[idxLast] || '').toLowerCase();
         const nameB = String(b.masterData[idxLast] || '').toLowerCase();
         return nameA.localeCompare(nameB);
      });

    const section      = document.createElement('div');
    section.className  = 'level-section mb-5';

    // Section header
    const headerRow         = document.createElement('div');
    headerRow.style.cssText = 'display: flex; align-items: center; justify-content: space-between; margin: 25px 0 10px 5px;';

    const titleContainer         = document.createElement('div');
    titleContainer.style.cssText = 'display: flex; align-items: center; gap: 10px;';

    const title         = document.createElement('h4');
    title.style.cssText = `margin: 0; font-weight: 700; font-size: 1.1rem; color: ${level === 'Dropped' ? '#ef4444' : 'var(--primary-color)'};`;
    title.innerText     = level;

    const countBadge         = document.createElement('span');
    countBadge.style.cssText = 'background: #f1f5f9; color: #64748b; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; border: 1px solid #e2e8f0;';
    countBadge.innerText     = filteredRows.length;

    titleContainer.appendChild(title);
    titleContainer.appendChild(countBadge);
    headerRow.appendChild(titleContainer);

    // Right-side button group: Add (active levels) + Copy IDs (all levels)
    const btnGroup         = document.createElement('div');
    btnGroup.style.cssText = 'display: flex; align-items: center; gap: 8px;';

    if (level !== 'Dropped') {
      const addBtn     = document.createElement('button');
      addBtn.innerHTML = '<i class="fa-solid fa-circle-plus"></i> Add';
      addBtn.className = 'add-student-btn';
      addBtn.onclick   = () => openAddStudentModal(level);
      btnGroup.appendChild(addBtn);
    }

    // Copy IDs button — always shown, disabled when no students
    const copyBtn     = document.createElement('button');
    copyBtn.className = 'add-student-btn ic-copy-btn';
    copyBtn.title     = `Copy ${level} student IDs for IC Ad Hoc filter`;
    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy IDs';
    if (filteredRows.length === 0) {
      copyBtn.disabled = true;
      copyBtn.style.opacity = '0.4';
    } else {
      copyBtn.onclick = () => copyLevelIDs(filteredRows, level);
    }
    btnGroup.appendChild(copyBtn);
    headerRow.appendChild(btnGroup);

    section.appendChild(headerRow);

    if (filteredRows.length > 0) {
      const tableWrapper = document.createElement('div');
      tableWrapper.id    = 'wrapper-' + level.replace(/\s+/g, '');
      section.appendChild(tableWrapper);
      
      buildModernTable(filteredRows, masterHeaders, tableWrapper, 'table-' + level.replace(/\s+/g, ''), {
        autoHeight: true,
        colMap: buildRosterColMap(window.ACTIVE_SEASON || 'SPRING', masterHeaders, rosterData)
      });
    } else {
      const emptyDiv         = document.createElement('div');
      emptyDiv.style.cssText = 'padding: 16px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;';
      emptyDiv.innerText     = `No students currently in ${level}.`;
      section.appendChild(emptyDiv);
    }

    container.appendChild(section);
  });
}

// ─── Table Builder ────────────────────────────────────────────────────────────

function buildModernTable(dataArr, headers, target, tableId, options = {}) {
  const container = (typeof target === 'string') ? document.getElementById(target) : target;
  if (!container || !dataArr) return;

  const { autoHeight = false, maxHeight = null, colMap = null } = options;
  const viewportClass = autoHeight ? 'table-viewport-auto' : 'table-viewport';
  const styleAttr     = maxHeight ? `style="max-height: ${maxHeight};"` : '';

  // Build header row — prepend an expand column
  const expandTh   = `<th class="col-expand"></th>`;
  const headerHtml = colMap
    ? colMap.map(m => `<th class="${m.className || ''}" style="text-align: ${m.align || 'left'}">${m.header}</th>`).join('')
    : '';

  const totalCols = (colMap ? colMap.length : 0) + 1; 

  let html = `<div class="${viewportClass}" ${styleAttr}>
                <table class="roster-table" id="${tableId}">
                  <thead><tr>${expandTh}${headerHtml}</tr></thead>
                  <tbody>`;

  for (let i = 0; i < dataArr.length; i++) {
    const row     = dataArr[i];
    const rowId   = String(row.id || '').trim();
    const safeId  = rowId.replace(/[^a-zA-Z0-9]/g, '_');

    const dateAdded   = row.dateAdded   || '';
    const dateMoved   = row.dateMoved   || '';
    const dateDropped = row.dateDropped || '';
    const hasDates    = dateAdded || dateMoved || dateDropped;

    const chevronCell = hasDates
      ? `<td class="col-expand">
           <button class="row-expand-btn" onclick="toggleRowDetail('detail-${safeId}', this)"
                   title="View date history" aria-expanded="false">
             <i class="fa-solid fa-chevron-right row-expand-chevron"></i>
           </button>
         </td>`
      : `<td class="col-expand"></td>`;

    let dataCells = '';
    if (colMap) {
      colMap.forEach(config => {
        const cellValue = config.formatter(row);
        dataCells += `<td style="text-align: ${config.align || 'left'}">${cellValue}</td>`;
      });
    }

    // Embed the searchable name in a data attribute to keep filterRoster fast
    const searchName = (row.masterData[headers.indexOf('Last Name')] + ' ' + row.masterData[headers.indexOf('First Name')]).toUpperCase();
    
    html += `<tr class="roster-data-row" data-search="${searchName}">${chevronCell}${dataCells}</tr>`;

    if (hasDates) {
      const datePills = buildDatePills(dateAdded, dateMoved, dateDropped);
      html += `
        <tr class="row-detail-row" id="detail-${safeId}" style="display:none;">
          <td></td>
          <td colspan="${totalCols - 1}">
            <div class="row-detail-inner">
              <span class="row-detail-label">
                <i class="fa-solid fa-clock-rotate-left"></i> Roster History
              </span>
              ${datePills}
            </div>
          </td>
        </tr>`;
    }
  }

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

/**
 * Builds the date pill HTML for the expandable row detail.
 */
function buildDatePills(dateAdded, dateMoved, dateDropped) {
  let html = '';
  if (dateAdded) {
    html += `<span class="date-pill date-pill-added">
               <i class="fa-solid fa-user-plus"></i>
               <span class="date-pill-label">Added</span>
               ${dateAdded}
             </span>`;
  }
  if (dateMoved) {
    html += `<span class="date-pill date-pill-moved">
               <i class="fa-solid fa-arrow-right-arrow-left"></i>
               <span class="date-pill-label">Last Moved</span>
               ${dateMoved}
             </span>`;
  }
  if (dateDropped) {
    html += `<span class="date-pill date-pill-dropped">
               <i class="fa-solid fa-user-xmark"></i>
               <span class="date-pill-label">Dropped</span>
               ${dateDropped}
             </span>`;
  }
  return html;
}

function toggleRowDetail(detailRowId, btn) {
  const detailRow = document.getElementById(detailRowId);
  if (!detailRow) return;

  const isOpen    = detailRow.style.display !== 'none';
  detailRow.style.display = isOpen ? 'none' : 'table-row';

  const chevron = btn.querySelector('.row-expand-chevron');
  if (chevron) chevron.classList.toggle('rotated', !isOpen);
  btn.setAttribute('aria-expanded', String(!isOpen));
}

// ─── Filter ───────────────────────────────────────────────────────────────────

function filterRoster() {
  const filter = document.getElementById('rosterSearch').value.toUpperCase();
  document.querySelectorAll('.roster-table').forEach(table => {
    Array.from(table.querySelectorAll('tr.roster-data-row')).forEach(tr => {
      const searchName = tr.getAttribute('data-search') || '';
      const matches = searchName.includes(filter);
      tr.style.display = matches ? '' : 'none';

      const btn    = tr.querySelector('.row-expand-btn');
      const safeId = btn ? btn.getAttribute('onclick').match(/detail-([^']+)/)?.[1] : null;
      if (safeId) {
        const detailRow = document.getElementById('detail-' + safeId);
        if (detailRow && !matches) detailRow.style.display = 'none';
      }
    });
  });
}

// ─── Formatting ───────────────────────────────────────────────────────────────

function renderManageStatus(row, headers) {
  const id        = row.id;
  const level     = row.level;
  
  const idxFirst  = headers.indexOf('First Name');
  const idxLast   = headers.indexOf('Last Name');
  const firstName = row.masterData[idxFirst] || "";
  const lastName  = row.masterData[idxLast] || "";
  const safeName  = `${firstName} ${lastName}`.replace(/'/g, "\\'");

  if (!id) return '<span style="color:#ccc">No ID</span>';

  const isDropped = level === 'Dropped';
  const canRaise  = level === 'Junior Varsity' || level === 'Freshman';
  const canLower  = level === 'Varsity'        || level === 'Junior Varsity';

  if (isDropped) {
    return `
      <div style="display: flex; justify-content: center;">
        <button class="add-student-btn" onclick="promptRestore('${id}', '${safeName}')">
          <i class="fa-solid fa-rotate-left"></i> Restore
        </button>
      </div>`;
  }

  return `
    <div style="display: flex; gap: 5px; justify-content: center;">
      <button class="add-student-btn"
              style="border-color: ${canRaise ? '#10b981' : '#e2e8f0'}; color: ${canRaise ? '#10b981' : '#cbd5e1'};"
              ${canRaise ? `onclick="quickMove('${id}', '${level}', 'UP')"` : 'disabled'}>
        <i class="fa-solid fa-arrow-up"></i>
      </button>
      <button class="add-student-btn"
              style="border-color: ${canLower ? '#f59e0b' : '#e2e8f0'}; color: ${canLower ? '#f59e0b' : '#cbd5e1'};"
              ${canLower ? `onclick="quickMove('${id}', '${level}', 'DOWN')"` : 'disabled'}>
        <i class="fa-solid fa-arrow-down"></i>
      </button>
      <button class="add-student-btn" style="border-color: #ef4444; color: #ef4444;"
              onclick="quickDrop('${id}', '${safeName}')">
        <i class="fa-solid fa-user-xmark"></i>
      </button>
    </div>`;
}

function renderMetricGroupWithStatus(row, headers, prefix, periodKey, hasAnyData) {
  if (!prefix || headers.length === 0) return `<span class="eligibility-status status-none">NO RECORD</span>`;

  const mData     = row.masterData;
  const studentId = row.id;
  const school    = window.GLOBAL_SCHOOL;

  const gpa     = mData[headers.indexOf(`${prefix}_GPA`)];
  const conduct = mData[headers.indexOf(`${prefix}_Number Of U's`)];
  const passing = mData[headers.indexOf(`${prefix}_Passing Classes`)];
  const classes = mData[headers.indexOf(`${prefix}_Number Of Classes`)];
  const status  = String(mData[headers.indexOf(`${prefix}_Status`)] || '').toUpperCase();
  
  const hasData    = (gpa !== "" && gpa !== null && gpa !== undefined);
  const isEligible = (status === 'ELIGIBLE');

  const probQualifyCol = `${prefix}_Probation_Qualify`;
  const waiverAppCol   = `${prefix}_Waiver_Approved`;

  const qualifyIdx = headers.indexOf(probQualifyCol);
  const isQualifyChecked = qualifyIdx > -1 ? String(mData[qualifyIdx]).toUpperCase() === 'TRUE' : false;

  const waiverIdx = headers.indexOf(waiverAppCol);
  const isWaiverChecked = waiverIdx > -1 ? String(mData[waiverIdx]).toUpperCase() === 'TRUE' : false;

  const globalWaiverIdx = headers.indexOf('Waiver Used');
  const hasGlobalWaiver = globalWaiverIdx > -1 ? String(mData[globalWaiverIdx]).toUpperCase() === 'TRUE' : false;

  const qualifyDisabled = isEligible || !hasData;
  const waiverDisabled = qualifyDisabled || !isQualifyChecked;

  // BADGE DISPLAY LOGIC (Now with unique IDs and the Orange state!)
  const badgeId = `badge-${studentId}-${periodKey}`;
  let badgeHtml;
  
  if (!hasData) {
    badgeHtml = hasAnyData
      ? `<span id="${badgeId}" class="eligibility-status status-none">NO RECORD</span>`
      : `<span id="${badgeId}" class="eligibility-status status-none">PENDING</span>`;
      
  } else if (isEligible) {
    badgeHtml = `<span id="${badgeId}" class="eligibility-status status-green">ELIGIBLE</span>`;
    
  } else if (isWaiverChecked || hasGlobalWaiver) {
    badgeHtml = `<span id="${badgeId}" class="eligibility-status status-blue">WAIVER</span>`;
    
  } else if (isQualifyChecked) {
    // NEW ORANGE QUALIFY STATE
    badgeHtml = `<span id="${badgeId}" class="eligibility-status" style="background-color: #fff7ed; color: #ea580c; border: 1px solid #fdba74;">QUALIFY</span>`;
    
  } else {
    badgeHtml = `<span id="${badgeId}" class="eligibility-status status-red">INELIGIBLE</span>`;
  }

  const gpaVal = hasData ? parseFloat(gpa).toFixed(2) : '-';
  const conVal = hasData ? conduct : '-';
  const pssVal = hasData ? passing : '-';
  const clsVal = hasData ? classes : '-';

  // Instant update functions mapped here
  const toggleQualifyAttr = `onchange="handleQualifyChange('${school}', '${studentId}', '${probQualifyCol}', '${waiverAppCol}', '${periodKey}', this)"`;
  const toggleWaiverAttr  = `onchange="handleWaiverChange('${school}', '${studentId}', '${waiverAppCol}', '${periodKey}', this)"`;

  return `
    <div class="grading-period-unit">
      ${badgeHtml}

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="m-label">GPA</span>
          <span class="${hasData && gpa < 2 ? 'text-danger' : 'text-success'}">${gpaVal}</span>
        </div>
        <div class="metric-item">
          <span class="m-label">CONDUCT</span>
          <span class="${hasData && conduct >= 2 ? 'text-danger' : 'text-success'}">${conVal}</span>
        </div>
        <div class="metric-item">
          <span class="m-label">PASSING</span>
          <span class="${hasData && passing < 4 ? 'text-danger' : 'text-success'}">${pssVal}</span>
        </div>
        <div class="metric-item">
          <span class="m-label">CLASSES</span>
          <span class="${hasData && classes < 4 ? 'text-danger' : 'text-success'}">${clsVal}</span>
        </div>
      </div>

      <div class="waiver-toggle-box">
        <div class="checkbox-row">
          <input type="checkbox" id="q-${studentId}-${periodKey}"
                 ${isQualifyChecked ? 'checked' : ''}
                 ${qualifyDisabled ? 'disabled' : ''}
                 ${toggleQualifyAttr}>
          <label for="q-${studentId}-${periodKey}" style="opacity: ${qualifyDisabled ? '0.4' : '1'};">Qualify</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="w-${studentId}-${periodKey}"
                 ${isWaiverChecked ? 'checked' : ''}
                 ${waiverDisabled ? 'disabled' : ''}
                 ${toggleWaiverAttr}>
          <label for="w-${studentId}-${periodKey}" style="opacity: ${waiverDisabled ? '0.4' : '1'};">Waiver</label>
        </div>
      </div>
    </div>`;
}

function buildRosterColMap(season, headers, allRosterData) {
  const seasonKey  = (season || 'SPRING').toUpperCase();
  const periodKeys = (window.CALENDAR_DATA.seasonPeriods || {})[seasonKey]
                   || ['S1_FINALS', 'S2_6WK', 'S2_12WK'];

  function activeKeyForSeason() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (const key of periodKeys) {
      const p = (window.CALENDAR_DATA.gradingPeriods || []).find(p => p.key === key);
      if (p && today >= parseLocalDate(p.start) && today <= parseLocalDate(p.end)) return key;
    }
    return null; 
  }

  const activeKey = activeKeyForSeason();

  const periodHasData = periodKeys.map(key => {
    const p = (window.CALENDAR_DATA.gradingPeriods || []).find(p => p.key === key);
    if (!p) return false;
    const prefix = p.prefix;
    const gpaIdx = headers.indexOf(`${prefix}_GPA`);
    if (gpaIdx === -1) return false;
    return allRosterData.some(row => {
      const gpa = row.masterData[gpaIdx];
      return gpa !== '' && gpa !== null && gpa !== undefined;
    });
  });

  const periodCols = periodKeys.map((key, i) => {
    const p = (window.CALENDAR_DATA.gradingPeriods || []).find(p => p.key === key);
    const label = p ? p.label : key;
    const prefix = p ? p.prefix : null;
    const hasAnyData = periodHasData[i];

    return {
      header:    label,
      className: 'col-grading-period' + (key === activeKey ? ' col-active-period' : ''),
      align:     'center',
      formatter: (row) => renderMetricGroupWithStatus(row, headers, prefix, key, hasAnyData)
    };
  });

  return [
    {
      header:    'Student Information',
      className: 'col-student-info',
      align:     'left',
      formatter: (row) => {
        const idxFirst  = headers.indexOf('First Name');
        const idxLast   = headers.indexOf('Last Name');
        const idxGrade  = headers.indexOf('Grade');
        const idxWaiver = headers.indexOf('Waiver Used');

        const first = row.masterData[idxFirst] || 'Unknown';
        const last  = row.masterData[idxLast] || 'Student';
        const grade = row.masterData[idxGrade] || '-';
        const usedWaiver = String(row.masterData[idxWaiver]).toUpperCase() === 'TRUE';

        const waiverIcon = usedWaiver
          ? `<div class="waiver-icon-container"><i class="fa-solid fa-person-running waiver-icon-large" title="Waiver Used"></i></div>`
          : '';
        return `
          <div class="student-cell-container">
            <div class="student-text-block">
              <p class="name-main">${last}, ${first}</p>
              <p class="row-subtext">ID: ${row.id} (${grade})</p>
            </div>
            ${waiverIcon}
          </div>`;
      }
    },
    ...periodCols,
    {
      header:    'Manage',
      className: 'col-manage',
      align:     'center',
      formatter: (row) => renderManageStatus(row, headers)
    }
  ];
}

// ─── Student Action Helpers ───────────────────────────────────────────────────

function sendUpdate(payload) {
  const sport = payload.sport;
  if (!sport) { alert('Error: No active sport found.'); return; }

  google.script.run
    .withSuccessHandler(updatedData => {
      window.ROSTER_CACHE[sport] = updatedData;
      renderRosterTables(updatedData);
    })
    .withFailureHandler(err => {
      console.error('Update failed:', err);
      alert('Update failed: ' + err.message);
    })
    .updateStudentData(payload);
}

function getCurrentSport() {
  return document.getElementById('active-sport-title').innerText;
}

function quickMove(id, currentLevel, direction) {
  const hierarchy    = ['Freshman', 'Junior Varsity', 'Varsity'];
  const currentIndex = hierarchy.indexOf(currentLevel.trim());
  const newIndex     = direction === 'UP' ? currentIndex + 1 : currentIndex - 1;
  if (newIndex < 0 || newIndex >= hierarchy.length) return;
  const newLevel = hierarchy[newIndex];
  const label    = direction === 'UP' ? 'Move Up' : 'Move Down';
  showSecretaryDateDialog({
    title:        label,
    message:      `When did this athlete move from <strong>${currentLevel}</strong> to <strong>${newLevel}</strong>?`,
    confirmLabel: label,
    confirmClass: 'sdd-btn-primary',
    onConfirm: actionDate => sendUpdate({
      school: window.GLOBAL_SCHOOL, sport: getCurrentSport(),
      id, colIndex: 1, value: newLevel, action: 'MOVE', actionDate, loggedBy: window.USER_EMAIL
    })
  });
}

function quickDrop(id, name) {
  showSecretaryDateDialog({
    title:        'Drop Athlete',
    message:      `When was the decision made to drop <strong>${name}</strong> from the program?`,
    confirmLabel: 'Drop Athlete',
    confirmClass: 'sdd-btn-danger',
    onConfirm: actionDate => sendUpdate({
      school: window.GLOBAL_SCHOOL, sport: getCurrentSport(),
      id, colIndex: 1, value: 'Dropped', action: 'DROP', actionDate, loggedBy: window.USER_EMAIL
    })
  });
}

function promptRestore(id, name) {
  const choice   = prompt(`Restore ${name} to which level?\n\n1: Varsity\n2: Junior Varsity\n3: Freshman`, '1');
  const levelMap = { '1': 'Varsity', '2': 'Junior Varsity', '3': 'Freshman' };
  const newLevel = levelMap[choice];
  if (!newLevel) return;
  showSecretaryDateDialog({
    title:        'Restore Athlete',
    message:      `When was <strong>${name}</strong> restored to <strong>${newLevel}</strong>?`,
    confirmLabel: 'Restore',
    confirmClass: 'sdd-btn-restore',
    onConfirm: actionDate => sendUpdate({
      school: window.GLOBAL_SCHOOL, sport: getCurrentSport(),
      id, colIndex: 1, value: newLevel, action: 'RESTORE', actionDate, loggedBy: window.USER_EMAIL
    })
  });
}

function showSecretaryDateDialog(opts) {
  let overlay = document.getElementById('secretary-date-dialog');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'secretary-date-dialog';
    overlay.className = 'sdd-backdrop';
    overlay.innerHTML = `
      <div class="sdd-card">
        <div class="sdd-title"></div>
        <div class="sdd-message"></div>
        <label class="sdd-label" for="sdd-date-input">Date</label>
        <input type="date" id="sdd-date-input" class="sdd-date-input">
        <div class="sdd-actions">
          <button class="sdd-cancel-btn">Cancel</button>
          <button class="sdd-confirm-btn"></button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }

  const today    = new Date();
  const todayStr = today.toISOString().split('T')[0];

  overlay.querySelector('.sdd-title').innerText    = opts.title;
  overlay.querySelector('.sdd-message').innerHTML  = opts.message;

  const dateInput = overlay.querySelector('#sdd-date-input');
  dateInput.value = todayStr;
  dateInput.max   = todayStr;

  const confirmBtn = overlay.querySelector('.sdd-confirm-btn');
  confirmBtn.innerText = opts.confirmLabel;
  confirmBtn.className = 'sdd-confirm-btn ' + (opts.confirmClass || 'sdd-btn-primary');

  const close = () => { overlay.style.display = 'none'; };

  confirmBtn.onclick = () => {
    const val = dateInput.value;
    if (!val) { dateInput.focus(); return; }
    const [y, m, d] = val.split('-');
    close();
    opts.onConfirm(`${parseInt(m)}/${parseInt(d)}/${y}`);
  };

  overlay.querySelector('.sdd-cancel-btn').onclick = close;

  overlay.onclick = e => { if (e.target === overlay) close(); };

  overlay.style.display = 'flex';
  dateInput.focus();
}

function copyLevelIDs(rows, level) {
  const ids = rows
    .map(row => String(row.id).trim())
    .filter(id => id && id !== 'undefined');

  if (ids.length === 0) return;

  const text = ids.join(', ');

  navigator.clipboard.writeText(text).then(() => {
    showICCopyToast(level, ids.length);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed; opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showICCopyToast(level, ids.length);
  });
}

function showICCopyToast(level, count) {
  const existing = document.getElementById('ic-copy-toast');
  if (existing) existing.remove();

  const toast       = document.createElement('div');
  toast.id          = 'ic-copy-toast';
  toast.style.cssText = `
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #f0fdf4; color: #15803d;
    border: 1px solid #bbf7d0;
    padding: 10px 20px; border-radius: 10px;
    font-size: 0.875rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    z-index: 9999; opacity: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    white-space: nowrap;
    transition: opacity 0.25s, transform 0.25s;`;
  toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${count} ${level} ID${count !== 1 ? 's' : ''} copied — paste into IC Ad Hoc filter`;
  document.body.appendChild(toast);

  requestAnimationFrame(() => {
    toast.style.opacity  = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    toast.style.opacity   = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

/**
 * Instantly updates the visual badge on the screen.
 */
function updateBadgeUI(studentId, periodKey, state) {
  const badge = document.getElementById(`badge-${studentId}-${periodKey}`);
  if (!badge) return;
  
  if (state === 'WAIVER') {
    badge.className = 'eligibility-status status-blue';
    badge.innerText = 'WAIVER';
    badge.style.cssText = ''; // Clear custom inline styles
  } else if (state === 'QUALIFY') {
    badge.className = 'eligibility-status'; // Base class for padding/shape
    badge.innerText = 'QUALIFY';
    // Custom inline CSS for the Orange state
    badge.style.cssText = 'background-color: #fff7ed; color: #ea580c; border: 1px solid #fdba74;';
  } else if (state === 'INELIGIBLE') {
    badge.className = 'eligibility-status status-red';
    badge.innerText = 'INELIGIBLE';
    badge.style.cssText = ''; 
  }
}

/**
 * Instantly updates UI for Qualify checkbox & handles Waiver lock
 */
function handleQualifyChange(school, studentId, qualifyCol, waiverCol, periodKey, checkbox) {
  const isChecked = checkbox.checked;
  google.script.run.updateEligibilityStatus(school, studentId, qualifyCol, isChecked);
  
  const waiverCheckbox = document.getElementById(`w-${studentId}-${periodKey}`);
  const waiverLabel = document.querySelector(`label[for="w-${studentId}-${periodKey}"]`);
  
  if (waiverCheckbox) {
    waiverCheckbox.disabled = !isChecked;
    if (waiverLabel) waiverLabel.style.opacity = isChecked ? '1' : '0.4';
    
    if (!isChecked && waiverCheckbox.checked) {
      waiverCheckbox.checked = false;
      google.script.run.updateEligibilityStatus(school, studentId, waiverCol, false);
    }
  }

  // Instantly update the badge!
  if (isChecked) {
     if (!waiverCheckbox || !waiverCheckbox.checked) {
         updateBadgeUI(studentId, periodKey, 'QUALIFY');
     }
  } else {
     updateBadgeUI(studentId, periodKey, 'INELIGIBLE');
  }
}

/**
 * Instantly updates UI for Waiver checkbox
 */
function handleWaiverChange(school, studentId, waiverCol, periodKey, checkbox) {
  const isChecked = checkbox.checked;
  google.script.run.updateEligibilityStatus(school, studentId, waiverCol, isChecked);

  // Instantly update the badge!
  if (isChecked) {
     updateBadgeUI(studentId, periodKey, 'WAIVER');
  } else {
     // If they uncheck Waiver, it falls back to the Orange Qualify state!
     updateBadgeUI(studentId, periodKey, 'QUALIFY');
  }
}
</script>
