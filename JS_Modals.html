<script>
// ── Modal State ───────────────────────────────────────────────────────────────
let targetLevel      = '';
let selectedStudents = [];

// ── Modal Lifecycle ───────────────────────────────────────────────────────────

function openAddStudentModal(level) {
  targetLevel = level;

  document.getElementById('modalTitle').innerText       = `Add Student to ${level}`;
  document.getElementById('directorySearch').value      = '';
  document.getElementById('searchResults').innerHTML    = '<p class="text-muted text-center p-3">Search the master directory to see results.</p>';
  document.getElementById('selectedQueue').innerHTML    = '<p class="text-muted empty-queue-msg">No students selected yet.</p>';
  
  const saveBtn = document.getElementById('saveRosterBtn');
  if (saveBtn) {
    saveBtn.innerHTML = '<i class="fas fa-save"></i> Save All to Roster';
    saveBtn.disabled  = true;
  }
  selectedStudents = [];

  const addDateInput = document.getElementById('addStudentDate');
  if (addDateInput) {
    const todayStr = new Date().toISOString().split('T')[0];
    addDateInput.value = todayStr;
    addDateInput.max   = todayStr;
  }

  document.getElementById('addStudentModal').style.display = 'block';
  setTimeout(() => document.getElementById('directorySearch').focus(), 100);
}

function closeModal() {
  document.getElementById('addStudentModal').style.display = 'none';
}

// ── Directory Search ──────────────────────────────────────────────────────────

function handleSearchKeyup(e) {
  if (e.key === 'Enter') performDirectorySearch();
}

function performDirectorySearch() {
  const input      = document.getElementById('directorySearch').value.toLowerCase();
  const resultsDiv = document.getElementById('searchResults');

  // Check if both data and headers are loaded
  if (!window.DIRECTORY_DATA || !window.DIRECTORY_HEADERS) {
    resultsDiv.innerHTML = `
      <div class="text-center p-4">
        <div class="spinner-small" style="margin: 0 auto;"></div>
        <p class="mt-2 text-muted">Syncing master directory... please wait.</p>
      </div>`;
    return;
  }

  const searchTerms = input.split(/[\s,]+/).filter(t => t.trim().length > 0);
  if (searchTerms.length === 0) {
    resultsDiv.innerHTML = '';
    return;
  }

  // DYNAMIC LOOKUP: Find the exact column index by its name
  const idxId    = window.DIRECTORY_HEADERS.indexOf('Student Number');
  const idxLast  = window.DIRECTORY_HEADERS.indexOf('Last Name');
  const idxFirst = window.DIRECTORY_HEADERS.indexOf('First Name');

  const filtered = window.DIRECTORY_DATA.filter(row => {
    const id    = String(row[idxId]).toLowerCase();
    const last  = String(row[idxLast]).toLowerCase();
    const first = String(row[idxFirst]).toLowerCase();
    return searchTerms.some(term => id.includes(term) || last.includes(term) || first.includes(term));
  }).slice(0, 50);

  displayDirectoryResults(filtered);
}

function displayDirectoryResults(results) {
  const resultsDiv = document.getElementById('searchResults');

  if (!results || results.length === 0) {
    resultsDiv.innerHTML = '<p class="text-center p-3">No students found.</p>';
    return;
  }

  window.lastSearchResults = results;

  let html = results.length > 1
    ? `<button class="btn-secondary btn-sm mb-2" onclick="addAllToQueue()">+ Add All to List</button>`
    : '';

  // DYNAMIC LOOKUP
  const idxId    = window.DIRECTORY_HEADERS.indexOf('Student Number');
  const idxLast  = window.DIRECTORY_HEADERS.indexOf('Last Name');
  const idxFirst = window.DIRECTORY_HEADERS.indexOf('First Name');
  const idxGrade = window.DIRECTORY_HEADERS.indexOf('Grade');

  results.forEach(student => {
    const safeData = btoa(unescape(encodeURIComponent(JSON.stringify(student))));
    html += `
      <div class="result-item">
        <div class="result-info">
          <strong class="result-name">${student[idxLast]}, ${student[idxFirst]}</strong>
          <span class="result-id">ID: ${student[idxId]} | Grade: ${student[idxGrade]}</span>
        </div>
        <button class="btn-add-to-queue" onclick="addToQueue('${safeData}')">
          <i class="fas fa-plus"></i>
        </button>
      </div>`;
  });

  resultsDiv.innerHTML = html;
}

// ── Queue Management ──────────────────────────────────────────────────────────

function addToQueue(encodedData) {
  const student = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
  const idxId = window.DIRECTORY_HEADERS.indexOf('Student Number');
  
  if (selectedStudents.some(s => s[idxId] === student[idxId])) return;
  selectedStudents.push(student);
  renderQueue();
}

function addAllToQueue() {
  if (!window.lastSearchResults) return;
  const idxId = window.DIRECTORY_HEADERS.indexOf('Student Number');
  
  window.lastSearchResults.forEach(student => {
    if (!selectedStudents.some(s => s[idxId] === student[idxId])) {
      selectedStudents.push(student);
    }
  });
  renderQueue();
  document.getElementById('searchResults').innerHTML =
    '<p class="text-success text-center p-3">All students added to list!</p>';
}

function removeFromQueue(index) {
  selectedStudents.splice(index, 1);
  renderQueue();
}

function renderQueue() {
  const queueDiv = document.getElementById('selectedQueue');
  const saveBtn  = document.getElementById('saveRosterBtn');

  if (selectedStudents.length === 0) {
    queueDiv.innerHTML = '<p class="text-muted empty-queue-msg">No students selected yet.</p>';
    saveBtn.disabled   = true;
    return;
  }

  saveBtn.disabled = false;
  
  // DYNAMIC LOOKUP
  const idxId    = window.DIRECTORY_HEADERS.indexOf('Student Number');
  const idxLast  = window.DIRECTORY_HEADERS.indexOf('Last Name');
  const idxFirst = window.DIRECTORY_HEADERS.indexOf('First Name');

  queueDiv.innerHTML = selectedStudents.map((s, idx) => `
    <div class="queue-item">
      <span>${s[idxFirst]} ${s[idxLast]} <small>(ID: ${s[idxId]})</small></span>
      <button onclick="removeFromQueue(${idx})" style="border: none; background: none; color: red; cursor: pointer;">&times;</button>
    </div>
  `).join('');
}

// ── Save ──────────────────────────────────────────────────────────────────────

function saveBulkRoster() {
  const isCoach = window.USER_ROLE === 'Coach';
  const sport   = isCoach
    ? window.COACH_SPORT
    : document.getElementById('active-sport-title').innerText;

  const addDateInput = document.getElementById('addStudentDate');
  if (!addDateInput || !addDateInput.value) {
    addDateInput && addDateInput.focus();
    addDateInput && addDateInput.classList.add('modal-date-input-error');
    setTimeout(() => addDateInput && addDateInput.classList.remove('modal-date-input-error'), 2000);
    return;
  }
  const [y, m, d] = addDateInput.value.split('-');
  const actionDate = `${parseInt(m)}/${parseInt(d)}/${y}`;

  const saveBtn = document.getElementById('saveRosterBtn');
  if (saveBtn) {
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    saveBtn.disabled = true;
  }

  // DYNAMIC LOOKUP: Format exactly how Code.gs expects it: [ID, First, Last]
  const idxId    = window.DIRECTORY_HEADERS.indexOf('Student Number');
  const idxLast  = window.DIRECTORY_HEADERS.indexOf('Last Name');
  const idxFirst = window.DIRECTORY_HEADERS.indexOf('First Name');

  const formattedStudents = selectedStudents.map(s => [s[idxId], s[idxFirst], s[idxLast]]);

  google.script.run
    .withSuccessHandler(() => {
      delete window.ROSTER_CACHE[sport];
      selectedStudents = [];
      if (saveBtn) {
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save All to Roster';
      }
      closeModal();
      
      if (isCoach) {
        fetchAndRenderCoachRoster(sport);
      } else {
        const activeNav = document.querySelector('.nav-item.active');
        handleSportClick(activeNav, window.ACTIVE_SEASON, sport);
      }
    })
    .withFailureHandler(err => {
      alert("Failed to save roster: " + err.message);
      if (saveBtn) {
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save All to Roster';
        saveBtn.disabled = false;
      }
    })
    .addBulkStudentsToSport(window.GLOBAL_SCHOOL, sport, formattedStudents, targetLevel, actionDate, window.USER_EMAIL);
}
</script>
